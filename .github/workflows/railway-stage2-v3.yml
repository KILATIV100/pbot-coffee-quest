name: Railway Stage 2 v3

on:
  push:
    branches: [main]
    paths:
      - '.railway/stage2-v3-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: pbot-brovary-universe
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  PUBLIC_URL: https://web-production-f3e45.up.railway.app

jobs:
  deploy-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Stage 2 v3 binary assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/v3
          cat \
            .stage2-v3/bg-00.part \
            .stage2-v3/bg-01.part \
            .stage2-v3/bg-02.part \
            .stage2-v3/bg-03.part \
            .stage2-v3/bg-04.part \
            | tr -d '\n\r' | base64 --decode > apps/web/public/assets/stage2/v3/level-bg.webp
          cat \
            .stage2-v3/dyn-00.part \
            .stage2-v3/dyn-01.part \
            .stage2-v3/dyn-02a.part \
            .stage2-v3/dyn-02b.part \
            .stage2-v3/dyn-02c.part \
            .stage2-v3/dyn-03a.part \
            .stage2-v3/dyn-03b.part \
            | tr -d '\n\r' | base64 --decode > apps/web/public/assets/stage2/v3/dynamic-atlas.webp
          test "$(stat -c%s apps/web/public/assets/stage2/v3/level-bg.webp)" = "57500"
          test "$(stat -c%s apps/web/public/assets/stage2/v3/dynamic-atlas.webp)" = "49488"
          echo '1ad1a987d34f33f8676555273207124143dc69124f279978e0750ff1fe935f91  apps/web/public/assets/stage2/v3/level-bg.webp' | sha256sum -c -
          echo 'b4a2bb389f4f6f904612761604ba4033d5cdcaa02438fa20a49627f7ce1c9b4c  apps/web/public/assets/stage2/v3/dynamic-atlas.webp' | sha256sum -c -

      - name: Validate Stage 2 v3 frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/public/game-stage2-v3.js
          grep -q 'width="960" height="540"' apps/web/public/index.html
          grep -q 'game-stage2-v3.js' apps/web/public/index.html
          ! grep -q 'game-stage2-v2.js' apps/web/public/index.html
          grep -q '/assets/stage2/v3/level-bg.webp' apps/web/public/styles.css

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Authenticate and link Railway
        shell: bash
        run: |
          set -euo pipefail
          railway whoami --json
          railway link --project "$PROJECT_NAME" --environment production --json

      - name: Deploy Stage 2 v3 web
        shell: bash
        run: |
          set -euo pipefail
          D='$'
          railway variable set --service web --environment production --skip-deploys \
            NODE_ENV=production PORT=3000 \
            "API_INTERNAL_URL=http://${D}{{api.RAILWAY_PRIVATE_DOMAIN}}:3001"
          railway up apps/web --path-as-root --service web --environment production --detach --json

      - name: Wait until v3 is actually live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/?stage2=v3" || true)"
            if [ "$code" = "200" ] && grep -q 'game-stage2-v3.js' /tmp/index.html; then
              bg="$(curl -L -sS -o /tmp/bg.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/v3/level-bg.webp?v=3" || true)"
              atlas="$(curl -L -sS -o /tmp/atlas.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/v3/dynamic-atlas.webp?v=3" || true)"
              if [ "$bg" = "200" ] && [ "$atlas" = "200" ] && \
                 [ "$(stat -c%s /tmp/bg.webp)" = "57500" ] && \
                 [ "$(stat -c%s /tmp/atlas.webp)" = "49488" ]; then
                ok=1
                break
              fi
            fi
            echo "Waiting for v3 deployment: ${i}/120 (index ${code})"
            sleep 5
          done
          test "$ok" = "1"
          echo 'v3 entrypoint and art assets are live.'

      - name: Smoke test web + API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/health.json -w '%{http_code}' "${PUBLIC_URL}/health")" = "200"
          test "$(curl -L -sS -o /tmp/meta.json -w '%{http_code}' "${PUBLIC_URL}/api/meta")" = "200"
          grep -q '"db":true' /tmp/meta.json
          cat /tmp/health.json
          cat /tmp/meta.json
          echo "Stage 2 v3: ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"
