name: Railway Stage 2 Art v4

on:
  push:
    branches: [main]
    paths:
      - '.railway/stage2-v3-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: pbot-brovary-universe
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  PUBLIC_URL: https://web-production-f3e45.up.railway.app

jobs:
  deploy-art-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild approved Stage 2 art
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/v3
          cat \
            .stage2-v3/bg-00.part \
            .stage2-v3/bg-01a1.exact .stage2-v3/bg-01a2.exact .stage2-v3/bg-01a3.exact .stage2-v3/bg-01a4.exact \
            .stage2-v3/bg-01b.fix .stage2-v3/bg-01c.fix .stage2-v3/bg-01d.fix \
            .stage2-v3/bg-02.part .stage2-v3/bg-03.part .stage2-v3/bg-04.part \
            | tr -d '\n\r' | base64 --decode > apps/web/public/assets/stage2/v3/level-bg.webp
          cat \
            .stage2-v3/dyn-00a.fix .stage2-v3/dyn-00b.fix .stage2-v3/dyn-00c.fix .stage2-v3/dyn-00d.fix \
            .stage2-v3/dyn-01.part \
            .stage2-v3/dyn-02a.part .stage2-v3/dyn-02b.part .stage2-v3/dyn-02c.part \
            .stage2-v3/dyn-03a.part .stage2-v3/dyn-03b.part \
            | tr -d '\n\r' | base64 --decode > apps/web/public/assets/stage2/v3/dynamic-atlas.webp
          test "$(stat -c%s apps/web/public/assets/stage2/v3/level-bg.webp)" = "57500"
          test "$(stat -c%s apps/web/public/assets/stage2/v3/dynamic-atlas.webp)" = "49488"
          echo '216d8da8cd4f1354b9be3e3e2fc6228a42925168dcb87f538076df8d264c6fb3  apps/web/public/assets/stage2/v3/level-bg.webp' | sha256sum -c -
          echo '16e808eedfa9cb967ab18c65e48b667ce0be247c7935fe23ef2f9618cbd7d0f1  apps/web/public/assets/stage2/v3/dynamic-atlas.webp' | sha256sum -c -

      - name: Validate decoded images and frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          for path, expected in [
            ('apps/web/public/assets/stage2/v3/level-bg.webp',(1600,332)),
            ('apps/web/public/assets/stage2/v3/dynamic-atlas.webp',(500,351)),
          ]:
            with Image.open(path) as im:
              im.load()
              assert im.format == 'WEBP', (path,im.format)
              assert im.size == expected, (path,im.size,expected)
              print(path, im.size, im.mode)
          PY
          node --check apps/web/public/game-stage2-v4.js
          node --check apps/web/server.js
          grep -q 'width="960" height="540"' apps/web/public/index.html
          grep -q 'game-stage2-v4.js' apps/web/public/index.html
          ! grep -q 'game-stage2-v3.js' apps/web/public/index.html
          grep -q "ASSET_VERSION='art6'" apps/web/public/game-stage2-v4.js
          grep -q 'ПОМИЛКА АСЕТІВ' apps/web/public/game-stage2-v4.js

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Authenticate and link Railway
        shell: bash
        run: |
          set -euo pipefail
          railway whoami --json
          railway link --project "$PROJECT_NAME" --environment production --json

      - name: Configure and deploy web
        shell: bash
        run: |
          set -euo pipefail
          D='$'
          railway variable set --service web --environment production --skip-deploys \
            NODE_ENV=production PORT=3000 \
            "API_INTERNAL_URL=http://${D}{{api.RAILWAY_PRIVATE_DOMAIN}}:3001"
          railway up apps/web --path-as-root --service web --environment production --detach --json

      - name: Verify v4 and exact public art
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            stamp="$(date +%s)"
            code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/?art6=${stamp}" || true)"
            js="$(curl -L -sS -o /tmp/game.js -w '%{http_code}' "${PUBLIC_URL}/game-stage2-v4.js?art6=${stamp}" || true)"
            bg="$(curl -L -sS -o /tmp/bg.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/v3/level-bg.webp?art6=${stamp}" || true)"
            atlas="$(curl -L -sS -o /tmp/atlas.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/v3/dynamic-atlas.webp?art6=${stamp}" || true)"
            if [ "$code" = 200 ] && [ "$js" = 200 ] && [ "$bg" = 200 ] && [ "$atlas" = 200 ] && \
               grep -q 'game-stage2-v4.js' /tmp/index.html && grep -q "ASSET_VERSION='art6'" /tmp/game.js && \
               [ "$(stat -c%s /tmp/bg.webp)" = 57500 ] && [ "$(stat -c%s /tmp/atlas.webp)" = 49488 ] && \
               echo '216d8da8cd4f1354b9be3e3e2fc6228a42925168dcb87f538076df8d264c6fb3  /tmp/bg.webp' | sha256sum -c - >/dev/null 2>&1 && \
               echo '16e808eedfa9cb967ab18c65e48b667ce0be247c7935fe23ef2f9618cbd7d0f1  /tmp/atlas.webp' | sha256sum -c - >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "Waiting art v4 ${i}/120 index=${code} js=${js} bg=${bg} atlas=${atlas}"
            sleep 5
          done
          test "$ok" = 1
          echo 'Stage 2 v4 entrypoint + exact approved art are live.'

      - name: Smoke test API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/meta.json -w '%{http_code}' "${PUBLIC_URL}/api/meta")" = 200
          grep -q '"db":true' /tmp/meta.json
          cat /tmp/meta.json
          echo "Stage 2 art v4 live: ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"
