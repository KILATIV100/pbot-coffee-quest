name: Railway Stage 2 v3

on:
  push:
    branches: [main]
    paths:
      - '.railway/stage2-v3-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: pbot-brovary-universe
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  PUBLIC_URL: https://web-production-f3e45.up.railway.app

jobs:
  deploy-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate safe-load Stage 2 v3
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/public/game-stage2-v3.js
          node --check apps/web/server.js
          grep -q 'width="960" height="540"' apps/web/public/index.html
          grep -q 'game-stage2-v3.js' apps/web/public/index.html
          ! grep -q 'game-stage2-v2.js' apps/web/public/index.html
          grep -q 'Promise.allSettled' apps/web/public/game-stage2-v3.js
          grep -q "bgFallback:'/assets/backgrounds/world01-level01.webp'" apps/web/public/game-stage2-v3.js

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Authenticate and link Railway
        shell: bash
        run: |
          set -euo pipefail
          railway whoami --json
          railway link --project "$PROJECT_NAME" --environment production --json

      - name: Configure and deploy web
        shell: bash
        run: |
          set -euo pipefail
          D='$'
          railway variable set --service web --environment production --skip-deploys \
            NODE_ENV=production PORT=3000 \
            "API_INTERNAL_URL=http://${D}{{api.RAILWAY_PRIVATE_DOMAIN}}:3001"
          railway up apps/web --path-as-root --service web --environment production --detach --json

      - name: Wait for safe-load v3 production
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            stamp="$(date +%s)"
            code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/?fix=${stamp}" || true)"
            js="$(curl -L -sS -o /tmp/game.js -w '%{http_code}' "${PUBLIC_URL}/game-stage2-v3.js?fix=${stamp}" || true)"
            if [ "$code" = "200" ] && [ "$js" = "200" ] && \
               grep -q 'game-stage2-v3.js' /tmp/index.html && \
               grep -q 'Promise.allSettled' /tmp/game.js && \
               grep -q 'safe asset mode active' /tmp/game.js; then
              ok=1
              break
            fi
            echo "Waiting ${i}/120 index=${code} js=${js}"
            sleep 5
          done
          test "$ok" = "1"

      - name: Smoke test API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/health.json -w '%{http_code}' "${PUBLIC_URL}/health")" = "200"
          test "$(curl -L -sS -o /tmp/meta.json -w '%{http_code}' "${PUBLIC_URL}/api/meta")" = "200"
          grep -q '"db":true' /tmp/meta.json
          cat /tmp/health.json
          cat /tmp/meta.json
          echo "Stage 2 v3 safe-load live: ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"
