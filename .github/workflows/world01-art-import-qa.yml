name: World 01 asset import
on:
  push:
    branches: [fix/world01-canonical-art]
    paths: [.github/workflows/world01-art-import-qa.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world01-canonical-art
      - name: Import only the public game code and owned artwork
        env:
          BUNDLE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ef58-8210-a8e7-0fa2e78f3b12/raw?se=2026-09-15T07%3A58%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=c01e968a-3cda-5432-988c-1f06476b105b&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A12%3A37Z&ske=2026-09-15T20%3A12%3A37Z&sks=b&skv=2026-02-06&sig=6UTafQDUNHjY1y7n2JqVHk9OOkTjoTCFzwf4bBlAbVs%3D'
        run: |
          echo "::add-mask::$BUNDLE_URL"
          curl --fail --silent --show-error --location --proto '=https' "$BUNDLE_URL" -o /tmp/world01.zip
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          b=pathlib.Path('/tmp/world01.zip').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='5b7b8ec6266de267242a34b7ff02bcf54fd686d0890ece2792cc2e8af06d8f75'
          with zipfile.ZipFile('/tmp/world01.zip') as z:
            for f in z.namelist():
              p=pathlib.PurePosixPath(f)
              assert f.startswith('apps/web/') and not p.is_absolute() and '..' not in p.parts, f
              assert not p.name.startswith('.env'),f
            z.extractall('.')
          PY
          node --check apps/web/public/final-game.js
          node --check apps/web/public/world01-v2.js
          git config user.name 'P-BOT build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web
          git diff --cached --quiet || git commit -m 'fix(world01): canonical city art, grounded layout, collision and viewport fixes'
          git push origin HEAD:fix/world01-canonical-art
