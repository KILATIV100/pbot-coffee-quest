name: World 01 browser QA
on:
  push:
    branches: [main, fix/world01-canonical-art]
    paths: ['apps/web/**', '.github/workflows/world01-art-import-qa.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/world01-art-import-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser dependencies
        working-directory: apps/web
        run: |
          node --check public/final-game.js
          node --check public/world01-v2.js
          node --check server.js
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile viewport browser checks
        run: |
          PORT=3100 node apps/web/server.js > /tmp/pbot-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3100/health && break || sleep 1; done
          QA_OUT=qa-output node apps/web/tests/world01-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world01-art-verified
          path: qa-output/
          retention-days: 7
