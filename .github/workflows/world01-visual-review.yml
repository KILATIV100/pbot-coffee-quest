name: World 01 visual review
on:
  push:
    branches: [release/final-brovary-universe]
    paths: [.github/workflows/world01-visual-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          mkdir -p /tmp/pbot-review
          cd /tmp/pbot-review
          npm init -y
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture production and source
        run: |
          mkdir -p review
          cp -R apps/web review/source-web
          cat > /tmp/pbot-review/capture.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[],requests=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>requests.push({url:r.url(),error:r.failure()}));
            page.on('response',r=>{if(r.status()>=400)requests.push({url:r.url(),status:r.status()})});
            await page.goto('https://web-production-f3e45.up.railway.app/',{waitUntil:'networkidle',timeout:60000});
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/review/production-menu.png'});
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/review/production-index.html',await page.content());
            const card=page.locator('.level-card:not([disabled])').first();
            if(await card.count()) await card.click();
            else if(await page.locator('#startBtn').count()) await page.locator('#startBtn').click({timeout:20000});
            await page.waitForTimeout(2000);
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/review/production-level01.png'});
            await page.keyboard.down('ArrowRight');await page.waitForTimeout(1800);await page.keyboard.up('ArrowRight');
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/review/production-level01-moving.png'});
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/review/production-console.json',JSON.stringify({title:await page.title(),url:page.url(),errors,requests},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/pbot-review/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world01-visual-review
          path: review/
          retention-days: 7
