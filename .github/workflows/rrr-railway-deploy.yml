name: RRR Railway Deploy

on:
  push:
    branches: [main]
    paths:
      - '.railway/rrr-deploy-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: rrr-next
  SERVICE_NAME: game-server
  TARGET_REPO: KILATIV100/new_pr
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Verify Railway auth
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN:-}"
          railway whoami --json

      - name: Link or create RRR project
        run: |
          set -euo pipefail
          if railway link --project "$PROJECT_NAME" --environment production --json >/tmp/link.json 2>/tmp/link.err; then
            cat /tmp/link.json
          else
            cat /tmp/link.err || true
            railway init --name "$PROJECT_NAME" --json | tee /tmp/init.json
          fi
          railway status --json

      - name: Ensure game server service
        run: |
          set -euo pipefail
          SERVICES="$(railway service list --json || true)"
          echo "$SERVICES"
          echo "$SERVICES" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"game-server"' || railway add --service "$SERVICE_NAME" --json
          railway service list --json

      - name: Connect private GitHub source
        run: |
          set -euo pipefail
          railway service source connect \
            --service "$SERVICE_NAME" \
            --environment production \
            --repo "$TARGET_REPO" \
            --branch main \
            --json

      - name: Configure runtime variables
        run: |
          set -euo pipefail
          railway variable set --service "$SERVICE_NAME" --environment production --skip-deploys \
            NODE_ENV=production

      - name: Ensure Railway domain
        run: |
          set -euo pipefail
          DOMAINS="$(railway domain list --service "$SERVICE_NAME" --environment production --json || true)"
          echo "$DOMAINS"
          echo "$DOMAINS" | grep -Eq 'railway\.app|up\.railway\.app' || railway domain --service "$SERVICE_NAME" --environment production --port 8080 --json

      - name: Wait for healthy RRR server
        run: |
          set -euo pipefail
          DOMAIN="$(railway domain list --service "$SERVICE_NAME" --environment production --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["domains"][0]["domain"])')"
          BASE="https://${DOMAIN}"
          echo "Testing ${BASE}/health"
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -L -sS -o /tmp/health.json -w '%{http_code}' "${BASE}/health" || true)"
            echo "health ${i}: ${code}"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          cat /tmp/health.json
          echo "PUBLIC_URL=${BASE}" >> "$GITHUB_ENV"

      - name: Final status
        run: |
          railway status --json
          railway service list --json
          railway domain list --service "$SERVICE_NAME" --environment production --json
          echo "RRR Railway URL: ${PUBLIC_URL}"
