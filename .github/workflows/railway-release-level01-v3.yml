name: Railway Stage 2 Level 01 Release v3

on:
  push:
    branches: [main]
    paths:
      - '.railway/release-level01-trigger-v3'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: pbot-brovary-universe
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  PUBLIC_URL: https://web-production-f3e45.up.railway.app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact release background
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/release
          cat .stage2-release-bg/bg-00.b64 .stage2-release-bg/bg-01.b64 .stage2-release-bg/bg-02.b64 .stage2-release-bg/bg-03.b64 .stage2-release-bg/bg-04.b64 .stage2-release-bg/bg-05.b64 .stage2-release-bg/bg-06.b64 \
            | tr -d '\n\r' | base64 --decode > apps/web/public/assets/stage2/release/bg.webp
          test "$(stat -c%s apps/web/public/assets/stage2/release/bg.webp)" = "69754"
          echo 'b95ae10967da0811daecbe46a75205abc25c653a5f21fe956cbd617e0494b898  apps/web/public/assets/stage2/release/bg.webp' | sha256sum -c -

      - name: Rebuild clean crouch and actors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/p0
          cat .stage2-p0/pbot-00.hex .stage2-p0/pbot-01.hex .stage2-p0/pbot-02.hex .stage2-p0/pbot-03.hex .stage2-p0/pbot-04.hex \
            | tr -d '\n\r' | python3 -c "import sys;sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))" > apps/web/public/assets/stage2/p0/pbot-p0.webp
          cat .stage2-p0/actors-00.hex .stage2-p0/actors-01a.hex .stage2-p0/actors-01b.hex .stage2-p0/actors-01c.hex .stage2-p0/actors-01d.hex .stage2-p0/actors-02.hex .stage2-p0/actors-03.hex \
            | tr -d '\n\r' | python3 -c "import sys;sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))" > apps/web/public/assets/stage2/p0/actors-p0.webp

      - name: Rebuild item atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/v3
          cat .stage2-v3/dyn-00a.fix .stage2-v3/dyn-00b.fix .stage2-v3/dyn-00c.fix .stage2-v3/dyn-00d.fix .stage2-v3/dyn-01.part .stage2-v3/dyn-02a.part .stage2-v3/dyn-02b.part .stage2-v3/dyn-02c.part .stage2-v3/dyn-03a.part .stage2-v3/dyn-03b.part \
            | tr -d '\n\r' | base64 --decode > apps/web/public/assets/stage2/v3/dynamic-atlas.webp

      - name: Validate release assets and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          checks=[
            ('apps/web/public/assets/stage2/release/bg.webp',(1440,480),False),
            ('apps/web/public/assets/stage2/p0/pbot-p0.webp',(420,330),True),
            ('apps/web/public/assets/stage2/p0/actors-p0.webp',(360,348),True),
            ('apps/web/public/assets/stage2/v3/dynamic-atlas.webp',(500,351),True),
            ('apps/web/public/assets/characters/pbot/sheet.webp',None,True),
          ]
          for path,dims,alpha in checks:
            with Image.open(path) as im:
              im.load()
              if dims: assert im.size==dims,(path,im.size,dims)
              if alpha: assert im.convert('RGBA').getchannel('A').getextrema()[0]==0,path
              print(path,im.size,im.mode)
          PY
          node --check apps/web/public/game-stage2-release.js
          node --check apps/web/server.js
          grep -q 'game-stage2-release.js' apps/web/public/index.html
          ! grep -q 'game-stage2-working.js' apps/web/public/index.html
          grep -q "BUILD='release-01'" apps/web/public/game-stage2-release.js
          ! grep -q 'drawStop' apps/web/public/game-stage2-release.js
          ! grep -q 'drawCharme' apps/web/public/game-stage2-release.js
          ! grep -q 'drawPerkUp' apps/web/public/game-stage2-release.js

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Authenticate and link Railway
        shell: bash
        run: |
          set -euo pipefail
          railway whoami --json
          railway link --project "$PROJECT_NAME" --environment production --json

      - name: Deploy release web
        shell: bash
        run: |
          set -euo pipefail
          D='$'
          railway variable set --service web --environment production --skip-deploys NODE_ENV=production PORT=3000 "API_INTERNAL_URL=http://${D}{{api.RAILWAY_PRIVATE_DOMAIN}}:3001"
          railway up apps/web --path-as-root --service web --environment production --detach --json

      - name: Verify public release
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            stamp="$(date +%s)"
            ic="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/?release=${stamp}" || true)"
            jc="$(curl -L -sS -o /tmp/game.js -w '%{http_code}' "${PUBLIC_URL}/game-stage2-release.js?release=${stamp}" || true)"
            bc="$(curl -L -sS -o /tmp/bg.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/release/bg.webp?release=${stamp}" || true)"
            hc="$(curl -L -sS -o /tmp/hero.webp -w '%{http_code}' "${PUBLIC_URL}/assets/characters/pbot/sheet.webp?release=${stamp}" || true)"
            if [ "$ic" = 200 ] && [ "$jc" = 200 ] && [ "$bc" = 200 ] && [ "$hc" = 200 ] && grep -q 'game-stage2-release.js' /tmp/index.html && grep -q "BUILD='release-01'" /tmp/game.js && [ "$(stat -c%s /tmp/bg.webp)" = 69754 ] && echo 'b95ae10967da0811daecbe46a75205abc25c653a5f21fe956cbd617e0494b898  /tmp/bg.webp' | sha256sum -c - >/dev/null 2>&1; then ok=1; break; fi
            echo "Waiting release ${i}/120 index=${ic} js=${jc} bg=${bc} hero=${hc}"
            sleep 5
          done
          test "$ok" = 1
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/bg.webp') as im: im.load(); assert im.size==(1440,480)
          with Image.open('/tmp/hero.webp') as im: im.load(); assert im.convert('RGBA').getchannel('A').getextrema()[0]==0
          PY

      - name: Smoke test API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/meta.json -w '%{http_code}' "${PUBLIC_URL}/api/meta")" = 200
          grep -q '"db":true' /tmp/meta.json

      - name: Write success sentinel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .railway
          cat > .railway/release-level01-status.txt <<EOF
          status=success
          release=release-01
          public_url=${PUBLIC_URL}
          source_sha=${GITHUB_SHA}
          validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          background_sha256=b95ae10967da0811daecbe46a75205abc25c653a5f21fe956cbd617e0494b898
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .railway/release-level01-status.txt
          git commit -m 'Record successful Level 01 release' || true
          git push
