name: Railway Stage 2 RC2.4E

on:
  push:
    branches: [main]
    paths:
      - '.railway/rc2-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: pbot-brovary-universe
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  PUBLIC_URL: https://web-production-f3e45.up.railway.app

jobs:
  deploy-rc2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified sprite assets from clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/rc1 apps/web/public/assets/stage2/p0
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          def rebuild(parts, output, expected_chars, expected_size, expected_sha):
              raw=''.join(Path(p).read_text(encoding='utf-8').replace('\n','').replace('\r','') for p in parts)
              assert len(raw)==expected_chars
              data=base64.b64decode(raw,validate=True); assert len(data)==expected_size
              assert hashlib.sha256(data).hexdigest()==expected_sha
              Path(output).write_bytes(data)
          rebuild([f'.stage2-rc1/bg-{i:02}.b64' for i in range(6)],'apps/web/public/assets/stage2/rc1/bg-loop.webp',86576,64932,'78c25f46ccc459e54a0345b6010526ccdca78191eaf84b29809add559c7c1a52')
          rebuild([f'.stage2-rc1/pbot3-{i:02}.b64' for i in range(3)],'apps/web/public/assets/stage2/rc1/pbot-atlas.webp',47136,35350,'ffea22b9f88714b630db6a0c4b6a4a55279be829518715629d76d5d87c1cad3c')
          rebuild([f'.stage2-rc1/props3-{i:02}.b64' for i in range(6)],'apps/web/public/assets/stage2/rc1/props-atlas.webp',95784,71838,'11b91d1f1ba4d4cea59e3a34698a867783d6c47953712970961fe6cd3ff485ed')
          PY
          cat .stage2-p0/actors-00.hex .stage2-p0/actors-01a.hex .stage2-p0/actors-01b.hex .stage2-p0/actors-01c.hex .stage2-p0/actors-01d.hex .stage2-p0/actors-02.hex .stage2-p0/actors-03.hex | tr -d '\n\r' | python3 -c "import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))" > apps/web/public/assets/stage2/p0/actors-p0.webp
          test "$(stat -c%s apps/web/public/assets/stage2/p0/actors-p0.webp)" = 25844

      - name: Validate RC2.4E scale contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          tests=[('apps/web/public/assets/stage2/rc1/bg-loop.webp',(1440,480)),('apps/web/public/assets/stage2/rc1/pbot-atlas.webp',(560,280)),('apps/web/public/assets/stage2/rc1/props-atlas.webp',(600,345)),('apps/web/public/assets/stage2/p0/actors-p0.webp',(360,348))]
          for path,size in tests:
              with Image.open(path) as im: im.load(); assert im.size==size
          PY
          node --check apps/web/public/game-stage2-rc2.js
          node --check apps/web/public/game-stage2-rc2-polish.js
          node --check apps/web/public/game-stage2-rc2-visual.js
          node --check apps/web/public/game-stage2-rc2-ui.js
          node --check apps/web/public/game-stage2-rc2-art.js
          node --check apps/web/public/game-stage2-rc2-world.js
          node --check apps/web/server.js
          grep -Fq 'RC2.4 SCALE PASS' apps/web/public/index.html
          grep -Fq "ART_BUILD='rc2-04-00'" apps/web/public/game-stage2-rc2-art.js
          grep -Fq "WORLD_BUILD='rc2-04-00'" apps/web/public/game-stage2-rc2-world.js
          grep -Fq "p.kind==='charme'?.80" apps/web/public/game-stage2-rc2-art.js
          grep -Fq 'const dh=clamp(p.h+34,66,116)' apps/web/public/game-stage2-rc2-world.js
          grep -Fq "props=props.filter(p=>p.kind!=='billboard')" apps/web/public/game-stage2-rc2-art.js

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Authenticate and link Railway
        shell: bash
        run: |
          set -euo pipefail
          railway whoami --json
          railway link --project "$PROJECT_NAME" --environment production --json

      - name: Deploy RC2.4E web
        shell: bash
        run: |
          set -euo pipefail
          D='$'
          railway variable set --service web --environment production --skip-deploys NODE_ENV=production PORT=3000 "API_INTERNAL_URL=http://${D}{{api.RAILWAY_PRIVATE_DOMAIN}}:3001"
          railway up apps/web --path-as-root --service web --environment production --detach --json

      - name: Verify public RC2.4E
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            stamp="$(date +%s)"
            ic="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/?rc24e=${stamp}" || true)"
            artc="$(curl -L -sS -o /tmp/art.js -w '%{http_code}' "${PUBLIC_URL}/game-stage2-rc2-art.js?rc24e=${stamp}" || true)"
            wc="$(curl -L -sS -o /tmp/world.js -w '%{http_code}' "${PUBLIC_URL}/game-stage2-rc2-world.js?rc24e=${stamp}" || true)"
            if [ "$ic" = 200 ] && [ "$artc" = 200 ] && [ "$wc" = 200 ] && grep -Fq 'RC2.4 SCALE PASS' /tmp/index.html && grep -Fq "ART_BUILD='rc2-04-00'" /tmp/art.js && grep -Fq "WORLD_BUILD='rc2-04-00'" /tmp/world.js; then ok=1;break;fi
            echo "Waiting RC2.4E ${i}/120 index=${ic} art=${artc} world=${wc}";sleep 5
          done
          test "$ok" = 1
          echo 'RC2.4E public scale pass verified.'

      - name: Smoke test API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/meta.json -w '%{http_code}' "${PUBLIC_URL}/api/meta")" = 200
          grep -q '"db":true' /tmp/meta.json
          echo "Stage 2 RC2.4E live: ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"
