name: Story and actor asset transfer
on:
  push:
    branches: [fix/story-actors-world01]
    paths: [.github/workflows/story-actors-transfer.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import only the reviewed web-game bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,io,pathlib
          url='https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-28a4-8210-bfe3-46c2b1b1f755/raw?se=2026-09-15T08%3A40%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=db100062-b6c2-5544-b2a0-bb10cdf9ef1e&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T05%3A58%3A44Z&ske=2026-09-16T05%3A58%3A44Z&sks=b&skv=2026-02-06&sig=eCWuTZjm0b9aFVLYq7S2Fq23abazj4aszADeeUZuLFU%3D'
          data=urllib.request.urlopen(url,timeout=50).read()
          assert hashlib.sha256(data).hexdigest()=='2f3e49c9a147a04d2585c99edc1724fb5f6fd52883f36dc586748b9ed487b522'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            for f in z.namelist():
              p=pathlib.PurePosixPath(f)
              assert f.startswith('apps/web/') and not p.is_absolute() and '..' not in p.parts
            z.extractall('.')
          PY
          git config user.name 'P-BOT build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web
          git diff --cached --quiet || git commit -m 'feat(world01): normalized actors, NPC story quests and checkpoint persistence'
          git push origin HEAD:fix/story-actors-world01
