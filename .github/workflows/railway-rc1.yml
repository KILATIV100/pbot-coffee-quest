name: Railway Stage 2 RC1

on:
  push:
    branches: [main]
    paths:
      - '.railway/rc1-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: pbot-brovary-universe
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  PUBLIC_URL: https://web-production-f3e45.up.railway.app

jobs:
  deploy-rc1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact RC1 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/assets/stage2/rc1 apps/web/public/assets/stage2/p0
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def rebuild(name, parts, output, expected_size, expected_sha):
              raw = ''.join(Path(p).read_text(encoding='utf-8') for p in parts)
              raw = raw.replace('\n', '').replace('\r', '')
              bad = [i for i, ch in enumerate(raw) if ch not in ALPHABET]

              def exact_decode(text):
                  try:
                      data = base64.b64decode(text, validate=True)
                  except Exception:
                      return None
                  if len(data) != expected_size:
                      return None
                  if hashlib.sha256(data).hexdigest() != expected_sha:
                      return None
                  return data

              data = exact_decode(raw)
              repaired = None
              if data is None and len(bad) == 1:
                  pos = bad[0]
                  original = raw[pos]
                  for replacement in ALPHABET:
                      candidate = raw[:pos] + replacement + raw[pos + 1:]
                      data = exact_decode(candidate)
                      if data is not None:
                          repaired = (pos, original, replacement)
                          break

              if data is None:
                  visible_bad = [(i, repr(raw[i])) for i in bad[:10]]
                  raise SystemExit(
                      f'{name}: unrecoverable base64 stream; chars={len(raw)} mod4={len(raw)%4} bad={visible_bad}'
                  )

              Path(output).write_bytes(data)
              if repaired:
                  print(f'{name}: deterministic repair pos={repaired[0]} {repaired[1]!r}->{repaired[2]!r}')
              print(f'{name}: OK bytes={len(data)} sha256={expected_sha}')

          rebuild(
              'bg',
              [f'.stage2-rc1/bg-{i:02}.b64' for i in range(6)],
              'apps/web/public/assets/stage2/rc1/bg-loop.webp',
              64932,
              '78c25f46ccc459e54a0345b6010526ccdca78191eaf84b29809add559c7c1a52',
          )
          rebuild(
              'pbot',
              [f'.stage2-rc1/pbot3-{i:02}.b64' for i in range(3)],
              'apps/web/public/assets/stage2/rc1/pbot-atlas.webp',
              35350,
              'ffea22b9f88714b630db6a0c4b6a4a55279be829518715629d76d5d87c1cad3c',
          )
          rebuild(
              'props',
              [f'.stage2-rc1/props3-{i:02}.b64' for i in range(6)],
              'apps/web/public/assets/stage2/rc1/props-atlas.webp',
              71838,
              '11b91d1f1ba4d4cea59e3a34698a867783d6c47953712970961fe6cd3ff485ed',
          )
          PY
          cat .stage2-p0/actors-00.hex .stage2-p0/actors-01a.hex .stage2-p0/actors-01b.hex .stage2-p0/actors-01c.hex .stage2-p0/actors-01d.hex .stage2-p0/actors-02.hex .stage2-p0/actors-03.hex \
            | tr -d '\n\r' | python3 -c "import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))" \
            > apps/web/public/assets/stage2/p0/actors-p0.webp
          test "$(stat -c%s apps/web/public/assets/stage2/rc1/bg-loop.webp)" = 64932
          test "$(stat -c%s apps/web/public/assets/stage2/rc1/pbot-atlas.webp)" = 35350
          test "$(stat -c%s apps/web/public/assets/stage2/rc1/props-atlas.webp)" = 71838
          test "$(stat -c%s apps/web/public/assets/stage2/p0/actors-p0.webp)" = 25844
          echo '78c25f46ccc459e54a0345b6010526ccdca78191eaf84b29809add559c7c1a52  apps/web/public/assets/stage2/rc1/bg-loop.webp' | sha256sum -c -
          echo 'ffea22b9f88714b630db6a0c4b6a4a55279be829518715629d76d5d87c1cad3c  apps/web/public/assets/stage2/rc1/pbot-atlas.webp' | sha256sum -c -
          echo '11b91d1f1ba4d4cea59e3a34698a867783d6c47953712970961fe6cd3ff485ed  apps/web/public/assets/stage2/rc1/props-atlas.webp' | sha256sum -c -
          echo '3b3c8e1d986849e83feb1f22815d1b00143c29012d833a6c5a0fbf04677015e2  apps/web/public/assets/stage2/p0/actors-p0.webp' | sha256sum -c -

      - name: Validate RC1 images and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          tests=[
            ('apps/web/public/assets/stage2/rc1/bg-loop.webp',(1440,480),False),
            ('apps/web/public/assets/stage2/rc1/pbot-atlas.webp',(560,280),True),
            ('apps/web/public/assets/stage2/rc1/props-atlas.webp',(600,345),True),
            ('apps/web/public/assets/stage2/p0/actors-p0.webp',(360,348),True),
          ]
          for path,size,alpha in tests:
            with Image.open(path) as im:
              im.load(); assert im.format=='WEBP'; assert im.size==size,(path,im.size,size)
              if alpha: assert im.convert('RGBA').getchannel('A').getextrema()==(0,255),path
              print(path,im.size,im.mode)
          PY
          node --check apps/web/public/game-stage2-rc1.js
          node --check apps/web/server.js
          grep -q 'game-stage2-rc1.js' apps/web/public/index.html
          grep -q "BUILD='rc1-01-01'" apps/web/public/game-stage2-rc1.js
          grep -q 'drawPropSprite' apps/web/public/game-stage2-rc1.js
          grep -q "crouch:\[280,140,140,140\]" apps/web/public/game-stage2-rc1.js
          grep -q 'props-atlas.webp' apps/web/public/game-stage2-rc1.js
          grep -q 'bg-loop.webp' apps/web/public/game-stage2-rc1.js
          ! grep -q 'game-stage2-release.js' apps/web/public/index.html
          ! grep -q 'game-stage2-working.js' apps/web/public/index.html
          ! grep -q '/assets/stage2/v3/' apps/web/public/game-stage2-rc1.js
          ! grep -q 'drawStore(' apps/web/public/game-stage2-rc1.js
          ! grep -q 'drawTree(' apps/web/public/game-stage2-rc1.js
          ! grep -q 'drawBusStop(' apps/web/public/game-stage2-rc1.js

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.40.1

      - name: Authenticate and link Railway
        shell: bash
        run: |
          set -euo pipefail
          railway whoami --json
          railway link --project "$PROJECT_NAME" --environment production --json

      - name: Deploy RC1 web
        shell: bash
        run: |
          set -euo pipefail
          D='$'
          railway variable set --service web --environment production --skip-deploys \
            NODE_ENV=production PORT=3000 \
            "API_INTERNAL_URL=http://${D}{{api.RAILWAY_PRIVATE_DOMAIN}}:3001"
          railway up apps/web --path-as-root --service web --environment production --detach --json

      - name: Verify public RC1
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            stamp="$(date +%s)"
            ic="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/?rc1=${stamp}" || true)"
            jc="$(curl -L -sS -o /tmp/game.js -w '%{http_code}' "${PUBLIC_URL}/game-stage2-rc1.js?rc1=${stamp}" || true)"
            bc="$(curl -L -sS -o /tmp/bg.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/rc1/bg-loop.webp?rc1=${stamp}" || true)"
            pc="$(curl -L -sS -o /tmp/pbot.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/rc1/pbot-atlas.webp?rc1=${stamp}" || true)"
            ac="$(curl -L -sS -o /tmp/props.webp -w '%{http_code}' "${PUBLIC_URL}/assets/stage2/rc1/props-atlas.webp?rc1=${stamp}" || true)"
            if [ "$ic" = 200 ] && [ "$jc" = 200 ] && [ "$bc" = 200 ] && [ "$pc" = 200 ] && [ "$ac" = 200 ] && \
               grep -q 'game-stage2-rc1.js' /tmp/index.html && grep -q "BUILD='rc1-01-01'" /tmp/game.js && \
               [ "$(stat -c%s /tmp/bg.webp)" = 64932 ] && [ "$(stat -c%s /tmp/pbot.webp)" = 35350 ] && [ "$(stat -c%s /tmp/props.webp)" = 71838 ] && \
               echo '78c25f46ccc459e54a0345b6010526ccdca78191eaf84b29809add559c7c1a52  /tmp/bg.webp' | sha256sum -c - >/dev/null 2>&1 && \
               echo 'ffea22b9f88714b630db6a0c4b6a4a55279be829518715629d76d5d87c1cad3c  /tmp/pbot.webp' | sha256sum -c - >/dev/null 2>&1 && \
               echo '11b91d1f1ba4d4cea59e3a34698a867783d6c47953712970961fe6cd3ff485ed  /tmp/props.webp' | sha256sum -c - >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "Waiting RC1 ${i}/120 index=${ic} js=${jc} bg=${bc} pbot=${pc} props=${ac}"
            sleep 5
          done
          test "$ok" = 1
          echo 'RC1 exact public assets verified.'

      - name: Smoke test API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -L -sS -o /tmp/meta.json -w '%{http_code}' "${PUBLIC_URL}/api/meta")" = 200
          grep -q '"db":true' /tmp/meta.json
          cat /tmp/meta.json
          echo "Stage 2 RC1 live: ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"
