name: Repair RC1 source chunks

on:
  push:
    branches: [main]
    paths:
      - '.railway/rc1-source-repair-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and verify exact source chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          bg=Path('.stage2-rc1/bg-05.b64')
          props=Path('.stage2-rc1/props3-01.b64')
          b=bg.read_text(encoding='utf-8')
          p=props.read_text(encoding='utf-8')
          assert b.endswith('q'),repr(b[-8:])
          assert p.endswith('Z'),repr(p[-8:])
          bg.write_text(b[:-1],encoding='utf-8')
          props.write_text(p[:-1],encoding='utf-8')

          def check(paths,size,sha):
              raw=''.join(Path(x).read_text(encoding='utf-8').replace('\n','').replace('\r','') for x in paths)
              data=base64.b64decode(raw,validate=True)
              assert len(data)==size,(len(data),size)
              assert hashlib.sha256(data).hexdigest()==sha
              return len(raw)

          bg_len=check([f'.stage2-rc1/bg-{i:02}.b64' for i in range(6)],64932,'78c25f46ccc459e54a0345b6010526ccdca78191eaf84b29809add559c7c1a52')
          props_len=check([f'.stage2-rc1/props3-{i:02}.b64' for i in range(6)],71838,'11b91d1f1ba4d4cea59e3a34698a867783d6c47953712970961fe6cd3ff485ed')
          assert bg_len==86576,bg_len
          assert props_len==95784,props_len
          print(f'clean source verified bg={bg_len} props={props_len}')
          PY
      - name: Commit clean chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .stage2-rc1/bg-05.b64 .stage2-rc1/props3-01.b64
          git diff --cached --check
          git commit -m 'Repair RC1 source chunk boundaries'
          git push origin HEAD:main
