<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#061015" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="build" content="rc2-04-03" />
  <title>P-BOT · Brovary Universe · RC2.4H</title>
  <link rel="stylesheet" href="/styles.css?v=rc2-04-03" />
  <link rel="stylesheet" href="/rc2-3-ui.css?v=rc2-04-03" />
</head>
<body>
  <div id="rotatePrompt" aria-hidden="true">
    <div class="rotate-card"><div class="rotate-icon">↻</div><b>Поверніть телефон</b><span>P-BOT працює горизонтально · 16:9</span></div>
  </div>
  <main id="app">
    <section id="intro" class="intro">
      <div class="intro-copy">
        <div class="eyebrow">P-BOT · BROVARY UNIVERSE</div>
        <h1>Менше шуму. Більше гри.</h1>
        <p>WORLD 01 · LEVEL 01 · RC2.4 MOBILE POLISH</p>
        <div class="stage-badges"><span>NO STALE UI</span><span>LIGHT CONTROLS</span><span>CURATED SECTORS</span><span>SAFE CAMERA</span></div>
        <button id="startBtn" disabled>ЗАВАНТАЖЕННЯ АСЕТІВ…</button>
        <small>01-01 · mobile / desktop · RC2.4H</small>
      </div>
    </section>
    <section id="gameShell" class="game-shell hidden">
      <canvas id="game" width="960" height="540" aria-label="P-BOT Brovary Universe RC2.4H"></canvas>
      <div class="hud">
        <button id="menuBtn" class="hud-round" aria-label="Меню">☰</button>
        <div class="world-chip"><b>01-01</b><span>Бровари</span></div>
        <div class="hud-right"><div class="chip">☕ <b id="beans">0</b></div><div class="chip">✦ <b id="tokens">0</b></div><div class="chip">♥ <b id="lives">3</b></div></div>
      </div>
      <div class="route-progress" aria-hidden="true"><span id="routeProgressFill"></span><i id="routeProgressLabel"></i></div>
      <div id="toast" class="toast"></div>
      <div class="controls" aria-hidden="true">
        <div class="move-controls"><button data-key="left" aria-label="Ліворуч">◀</button><button data-key="right" aria-label="Праворуч">▶</button></div>
        <div class="action-controls"><button data-key="action" class="small ability" aria-label="Perky Pulse">◎</button><button data-key="down" class="small" aria-label="Присісти">▼</button><button data-key="jump" class="jump" aria-label="Стрибок">▲</button></div>
      </div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/game-stage2-rc2.js?v=rc2-04-03"></script>
  <script src="/game-stage2-rc2-polish.js?v=rc2-04-03"></script>
  <script src="/game-stage2-rc2-visual.js?v=rc2-04-03"></script>
  <script src="/game-stage2-rc2-ui.js?v=rc2-04-03"></script>
  <script src="/game-stage2-rc2-art.js?v=rc2-04-03"></script>
  <script src="/game-stage2-rc2-world.js?v=rc2-04-03"></script>
  <script src="/game-stage2-rc2-camera.js?v=rc2-04-03"></script>
</body>
</html>
