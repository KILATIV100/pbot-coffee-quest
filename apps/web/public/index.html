<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#071015" />
  <title>P-BOT · Brovary Universe</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="rotatePrompt" aria-hidden="true">
    <div class="rotate-card"><div class="rotate-icon">↻</div><b>Поверніть телефон</b><span>P-BOT грається горизонтально · 16:9</span></div>
  </div>
  <main id="app">
    <section id="intro" class="intro">
      <div class="intro-copy">
        <div class="eyebrow">P-BOT · BROVARY UNIVERSE</div>
        <h1>Місто прокидається</h1>
        <p>WORLD 01 · Розвилка · Stage 2</p>
        <button id="startBtn">ЗАВАНТАЖЕННЯ…</button>
      </div>
    </section>

    <section id="gameShell" class="game-shell hidden">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="hud">
        <button id="menuBtn" class="hud-round" aria-label="Меню">☰</button>
        <div class="world-chip"><b>01-01</b><span>Місто прокидається</span></div>
        <div class="hud-right">
          <div class="chip">☕ <b id="beans">0</b></div>
          <div class="chip">★ <b id="tokens">0</b></div>
          <div class="chip">♥ <b id="lives">3</b></div>
        </div>
      </div>
      <div id="toast" class="toast"></div>
      <div class="controls" aria-hidden="true">
        <div class="move-controls">
          <button data-key="left">◀</button><button data-key="right">▶</button>
        </div>
        <div class="action-controls">
          <button data-key="down" class="small">▼</button><button data-key="jump" class="jump">▲</button>
        </div>
      </div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/game-stage2.js"></script>
</body>
</html>
