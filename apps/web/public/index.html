<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#061015" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>P-BOT · Brovary Universe · RC2.3D</title>
  <link rel="stylesheet" href="/styles.css?v=rc2-02-02" />
  <link rel="stylesheet" href="/rc2-3-ui.css?v=rc2-03-03" />
  <style>
    .route-progress{position:absolute;z-index:4;top:max(60px,calc(env(safe-area-inset-top) + 52px));left:50%;width:min(38vw,360px);height:18px;transform:translateX(-50%);border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(3,14,18,.58);overflow:hidden;pointer-events:none;box-shadow:0 5px 20px rgba(0,0,0,.22)}
    .route-progress span{position:absolute;inset:0;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,rgba(85,229,216,.45),rgba(105,243,228,.92));transition:transform .12s linear}
    .route-progress i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:900;letter-spacing:.06em;color:#eafffd;text-shadow:0 1px 4px #031014}
  </style>
</head>
<body>
  <div id="rotatePrompt" aria-hidden="true">
    <div class="rotate-card"><div class="rotate-icon">↻</div><b>Поверніть телефон</b><span>P-BOT працює горизонтально · 16:9</span></div>
  </div>
  <main id="app">
    <section id="intro" class="intro">
      <div class="intro-copy">
        <div class="eyebrow">P-BOT · BROVARY UNIVERSE</div>
        <h1>Місто стає рівнем</h1>
        <p>WORLD 01 · LEVEL 01 · RC2.3 CLEANUP PASS</p>
        <div class="stage-badges"><span>THIN HUD</span><span>NO BIG OVERLAYS</span><span>CITY STRUCTURES</span><span>PLAYER FOCUS</span></div>
        <button id="startBtn" disabled>ЗАВАНТАЖЕННЯ АСЕТІВ…</button>
        <small>01-01 · mobile / desktop · RC2.3D</small>
      </div>
    </section>
    <section id="gameShell" class="game-shell hidden">
      <canvas id="game" width="960" height="540" aria-label="P-BOT Brovary Universe RC2.3D"></canvas>
      <div class="hud">
        <button id="menuBtn" class="hud-round" aria-label="Меню">☰</button>
        <div class="world-chip"><b>01-01</b><span>Бровари</span></div>
        <div class="hud-right"><div class="chip">☕ <b id="beans">0</b></div><div class="chip">✦ <b id="tokens">0</b></div><div class="chip">♥ <b id="lives">3</b></div></div>
      </div>
      <div class="route-progress" aria-hidden="true"><span id="routeProgressFill"></span><i id="routeProgressLabel">0%</i></div>
      <div id="toast" class="toast"></div>
      <div class="controls" aria-hidden="true">
        <div class="move-controls"><button data-key="left" aria-label="Ліворуч">◀</button><button data-key="right" aria-label="Праворуч">▶</button></div>
        <div class="action-controls"><button data-key="action" class="small ability" aria-label="Perky Pulse">◎</button><button data-key="down" class="small" aria-label="Присісти">▼</button><button data-key="jump" class="jump" aria-label="Стрибок">▲</button></div>
      </div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/game-stage2-rc2.js?v=rc2-02-00"></script>
  <script src="/game-stage2-rc2-polish.js?v=rc2-02-02"></script>
  <script src="/game-stage2-rc2-visual.js?v=rc2-02-02"></script>
  <script src="/game-stage2-rc2-ui.js?v=rc2-03-03"></script>
  <script src="/game-stage2-rc2-art.js?v=rc2-03-03"></script>
  <script src="/game-stage2-rc2-world.js?v=rc2-03-02"></script>
</body>
</html>
