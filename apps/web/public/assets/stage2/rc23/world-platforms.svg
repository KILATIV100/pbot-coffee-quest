<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="320" viewBox="0 0 1024 320">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5c6f76"/><stop offset="1" stop-color="#1c2b31"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8de6ea" stop-opacity=".34"/><stop offset="1" stop-color="#2c7180" stop-opacity=".12"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a77350"/><stop offset="1" stop-color="#5a3c30"/></linearGradient>
    <linearGradient id="charme" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d1f24"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feGaussianBlur stdDeviation="4"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feOffset dy="5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- 0 planter / Krona Park -->
  <g id="planter" transform="translate(0 0)">
    <ellipse cx="128" cy="148" rx="102" ry="8" fill="#000" opacity=".22" filter="url(#shadow)"/>
    <path d="M18 28h220v22H18z" fill="#d5d7d5" stroke="#26363a" stroke-width="5"/>
    <path d="M25 50h206l-18 84H43z" fill="#8b5b43" stroke="#3e302a" stroke-width="5"/>
    <g stroke="#6d4533" stroke-width="3" opacity=".7"><path d="M48 53v74M82 53v74M116 53v74M150 53v74M184 53v74M218 53v74"/></g>
    <path d="M36 48c13-31 37-30 52-5 12-31 37-39 56-6 18-29 44-25 54 6 13-17 31-15 42 5z" fill="#2f8c67" stroke="#164638" stroke-width="5"/>
    <g fill="#71d997"><circle cx="58" cy="35" r="8"/><circle cx="116" cy="29" r="9"/><circle cx="173" cy="34" r="8"/><circle cx="211" cy="40" r="6"/></g>
  </g>

  <!-- 1 shelter roof -->
  <g id="shelter" transform="translate(256 0)">
    <ellipse cx="128" cy="149" rx="105" ry="8" fill="#000" opacity=".22" filter="url(#shadow)"/>
    <path d="M18 25h220l-12 24H30z" fill="#263a42" stroke="#0b181d" stroke-width="6"/>
    <path d="M31 49h194v12H31z" fill="#6feadf" opacity=".85"/>
    <path d="M43 57v84M213 57v84" stroke="#314b54" stroke-width="9"/>
    <rect x="50" y="62" width="156" height="62" fill="url(#glass)" stroke="#70cbd3" stroke-width="3"/>
    <rect x="72" y="99" width="112" height="13" rx="6" fill="#66777c"/>
    <rect x="77" y="71" width="102" height="22" rx="6" fill="#08191f" stroke="#67e7dc" stroke-width="2"/>
    <text x="128" y="87" text-anchor="middle" fill="#eafffd" font-family="Arial,sans-serif" font-size="13" font-weight="800">БРОВАРИ</text>
  </g>

  <!-- 2 lakeside boardwalk -->
  <g id="boardwalk" transform="translate(512 0)">
    <ellipse cx="128" cy="149" rx="106" ry="8" fill="#000" opacity=".2" filter="url(#shadow)"/>
    <path d="M18 27h220v23H18z" fill="#b7c1bf" stroke="#334348" stroke-width="5"/>
    <path d="M27 50h202v42H27z" fill="url(#wood)" stroke="#452f29" stroke-width="4"/>
    <g stroke="#d5a477" stroke-width="3" opacity=".65"><path d="M48 54v34M78 54v34M108 54v34M138 54v34M168 54v34M198 54v34"/></g>
    <path d="M41 92v43M215 92v43M78 92v33M178 92v33" stroke="#40545a" stroke-width="7"/>
    <path d="M29 129c31-15 54 10 89-2 32-12 66 12 111-3" fill="none" stroke="#6fdae2" stroke-width="8" opacity=".7"/>
    <g stroke="#567b42" stroke-width="4"><path d="M53 135l-3-31M64 135l6-38M197 136l5-36M211 136l-3-28"/></g>
  </g>

  <!-- 3 city awning / kiosk -->
  <g id="awning" transform="translate(768 0)">
    <ellipse cx="128" cy="149" rx="101" ry="8" fill="#000" opacity=".22" filter="url(#shadow)"/>
    <path d="M20 25h216v24H20z" fill="#e8eceb" stroke="#36464b" stroke-width="5"/>
    <path d="M28 49h200l-18 27H46z" fill="#276b70" stroke="#173a3f" stroke-width="4"/>
    <path d="M49 75v65M207 75v65" stroke="#34484e" stroke-width="8"/>
    <rect x="61" y="79" width="134" height="46" rx="4" fill="#293a40" stroke="#5a6f76" stroke-width="3"/>
    <g fill="#72e7dd" opacity=".75"><rect x="75" y="89" width="32" height="7" rx="3"/><rect x="116" y="89" width="64" height="7" rx="3"/><rect x="75" y="103" width="48" height="7" rx="3"/></g>
  </g>

  <!-- 4 CHARME loading dock -->
  <g id="charmeDock" transform="translate(0 160)">
    <ellipse cx="128" cy="148" rx="105" ry="8" fill="#000" opacity=".28" filter="url(#shadow)"/>
    <path d="M17 25h222v25H17z" fill="#f0f1f2" stroke="#41434a" stroke-width="5"/>
    <path d="M25 50h206v78l-20 13H45l-20-13z" fill="url(#charme)" stroke="#06070a" stroke-width="6"/>
    <path d="M42 64h172" stroke="#6ef1e4" stroke-width="4" stroke-dasharray="26 10" filter="url(#glow)"/>
    <path d="M48 83h160v38H48z" fill="#13161c" stroke="#343741" stroke-width="3"/>
    <text x="128" y="108" text-anchor="middle" fill="#f2f3f4" font-family="Arial,sans-serif" font-size="22" font-weight="900" letter-spacing="4">CHARME</text>
    <path d="M71 129h114" stroke="#84888f" stroke-width="5"/>
  </g>

  <!-- 5 road sign gantry -->
  <g id="gantry" transform="translate(256 160)">
    <ellipse cx="128" cy="149" rx="103" ry="8" fill="#000" opacity=".23" filter="url(#shadow)"/>
    <path d="M17 24h222v21H17z" fill="#8d9ba0" stroke="#2f4147" stroke-width="5"/>
    <path d="M45 45v94M211 45v94" stroke="#465b62" stroke-width="9"/>
    <rect x="55" y="58" width="146" height="45" rx="6" fill="#176d75" stroke="#d8f4f1" stroke-width="3"/>
    <text x="128" y="80" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="900">БРОВАРИ</text>
    <text x="128" y="96" text-anchor="middle" fill="#aefaf3" font-family="Arial,sans-serif" font-size="10" font-weight="700">ЦЕНТР  →</text>
    <path d="M46 115h164" stroke="#25343a" stroke-width="8"/>
  </g>

  <!-- 6 road overpass -->
  <g id="overpass" transform="translate(512 160)">
    <ellipse cx="128" cy="149" rx="108" ry="8" fill="#000" opacity=".24" filter="url(#shadow)"/>
    <path d="M15 24h226v31H15z" fill="#9ba3a4" stroke="#414b4e" stroke-width="6"/>
    <path d="M29 55h198v20H29z" fill="#4f5b60"/>
    <path d="M48 75v64M208 75v64" stroke="#566166" stroke-width="18"/>
    <path d="M35 64h186" stroke="#f1cf54" stroke-width="4" stroke-dasharray="24 14"/>
    <path d="M53 137h150" stroke="#333d41" stroke-width="7"/>
  </g>

  <!-- 7 utility / industrial walkway -->
  <g id="utility" transform="translate(768 160)">
    <ellipse cx="128" cy="148" rx="105" ry="8" fill="#000" opacity=".25" filter="url(#shadow)"/>
    <path d="M17 24h222v22H17z" fill="#6c7c82" stroke="#26383e" stroke-width="5"/>
    <path d="M30 46h196v72H30z" fill="url(#metal)" stroke="#142329" stroke-width="5"/>
    <path d="M45 68h166M45 94h166" stroke="#7fe8df" stroke-width="5" opacity=".55"/>
    <circle cx="61" cy="81" r="16" fill="#1d2e34" stroke="#8ea0a5" stroke-width="5"/>
    <circle cx="195" cy="81" r="16" fill="#1d2e34" stroke="#8ea0a5" stroke-width="5"/>
    <path d="M47 118v21M209 118v21" stroke="#40545b" stroke-width="10"/>
    <path d="M56 135h144" stroke="#202e33" stroke-width="7"/>
  </g>
</svg>
